services:
  - type: web
    name: bloom-wellness
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: bloom-db
    databaseName: bloom
    user: bloom
    plan: free
